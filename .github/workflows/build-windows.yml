name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Run tests
        shell: pwsh
        run: |
          pytest -q

      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller --name Prenomina --onefile --windowed --collect-all webview --collect-all openpyxl --hidden-import=webview.platforms.edgechromium desktop_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\prenomina.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prenomina-Windows-Installer
          path: installer/output/*.exe
